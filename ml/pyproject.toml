[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iqa-ml"
version = "0.1.0"
description = "AI-Based Medical Image Quality and Reliability Assessment - ML core (FYP 23F-34)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pydicom>=2.4",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["medmnist>=3.0", "nibabel>=5.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["iqa_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
